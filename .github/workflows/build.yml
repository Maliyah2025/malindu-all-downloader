name: Build Malindu All Downloader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Android Project
        run: |
          unzip -q Malindu_All_Downloader_Fast_Project.zip -d src
          echo "Project extracted successfully"
          ls -la src/Malindu_All_Downloader

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: 'yes'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Install Android SDK Packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests

      - name: Run Python Tests
        working-directory: src/Malindu_All_Downloader
        run: |
          python -m pytest tests/test_downloader.py -q

      - name: Build Android Debug APK
        working-directory: src/Malindu_All_Downloader
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          ls -lh src/Malindu_All_Downloader/app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Malindu-All-Downloader-APK
          path: src/Malindu_All_Downloader/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Completed
        run: |
          echo "================================"
          echo " MALINDU ALL DOWNLOADER"
          echo " APK BUILD SUCCESSFUL"
          echo "================================"
